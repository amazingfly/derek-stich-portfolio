name: Deploy Next.js site to Pages

on:
  push:
    branches: ["testing"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Decode resume PDF
        run: |
          mkdir -p public
          cat public/resume.pdf.b64.part1 public/resume.pdf.b64.part2 | base64 -d > public/resume.pdf
          ls -la public/resume.pdf
          file public/resume.pdf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Next.js
        env:
          NEXT_PUBLIC_BASE_PATH: /derek-stich-portfolio
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
